services:
  - type: web
    name: blue-tech
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /favicon.ico
        destination: /favicon.svg
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Safe on any site regardless of script/connect sources in use — no risk of breaking
      # Google Sign-In, Stripe Elements, or the Tawk.to widget.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      # frame-ancestors/object-src/base-uri don't touch script-src or connect-src, so this can't
      # break Google Sign-In, Stripe Elements, or Tawk.to — a stricter policy that also locks down
      # script-src/style-src/connect-src is drafted separately and needs a deliberate test pass
      # against login, checkout, and chat before it ships (see the security audit notes).
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
